# Sample Project Configuration for Hungarian Residential Takeoff
project:
  name: "Családi ház energetikai korszerűsítés és homlokzati hőszigetelés"
  code: "TZ-2026-BP-001"
  description: "Budapesti családi ház homlokzati hőszigetelése (EPS Grafit Reflex 15 cm), lábazati XPS és belső felületképzés"
  client: "Magánmegrendelő"
  location: "Budapest, II. kerület"

takeoff_modules:
  facade:
    enabled: true
    insulation_type: "EPS Grafit"
    insulation_thickness_cm: 15.0
    plinth_insulation_type: "XPS"
    plinth_height_cm: 40.0
    opening_reveal_depth_cm: 12.0
    include_mesh_and_primer: true
  finishes:
    enabled: true
    default_plaster_type: "Mész-cement gépi vakolat"
    default_wall_paint: "Diszperziós beltéri falfesték 2 rtg."
    skirting_allowance_percent: 5.0

units:
  dimension_input_unit: "cm"
  calculation_internal_unit: "m"
  area_unit: "m2"
