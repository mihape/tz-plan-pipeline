[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tz-plan-pipeline"
version = "0.1.0"
description = "AI-assisted construction drawing analysis and quantity takeoff system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "TZ Plan Pipeline Team"}
]
keywords = ["construction", "quantity-takeoff", "cad", "pdf", "takeoff", "facade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
tz = "tz_plan_pipeline.cli.main:app"
tz-pipeline = "tz_plan_pipeline.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
